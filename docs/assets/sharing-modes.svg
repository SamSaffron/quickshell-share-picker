<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Three ways to choose what to share</title>
  <desc id="desc">Window shares one application window, Screen shares a whole output, and Region shares a rectangle selected with slurp. This is a schematic, not a screenshot.</desc>
  <rect width="1200" height="350" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(12 12)">
      <rect width="376" height="308" rx="18" fill="#f0f5ff" stroke="#dce6f6"/>
      <text x="24" y="38" fill="#2355bc" font-size="23" font-weight="700">Window</text>
      <text x="24" y="64" fill="#52687a" font-size="16">One application. Not the whole desktop.</text>
      <rect x="53" y="86" width="270" height="140" rx="9" fill="#e2e9f4"/>
      <rect x="67" y="101" width="116" height="87" rx="5" fill="#f7f9fc" stroke="#bccadd"/>
      <path d="M78 116h55m-55 15h89m-89 13h65m-65 13h79" stroke="#c5d1e1" stroke-width="5" stroke-linecap="round"/>
      <rect x="161" y="120" width="141" height="91" rx="6" fill="#fff" stroke="#3468d4" stroke-width="3"/>
      <path d="M161 139h141" stroke="#3468d4" stroke-width="2"/>
      <circle cx="173" cy="129" r="3" fill="#3468d4"/>
      <path d="M178 156h82m-82 15h102m-102 15h64" stroke="#97b4ee" stroke-width="5" stroke-linecap="round"/>
      <text x="24" y="262" fill="#243d53" font-size="17" font-weight="700">Pick a window. Check its preview.</text>
      <text x="24" y="285" fill="#52687a" font-size="16">Current workspace comes first.</text>
    </g>
    <g transform="translate(412 12)">
      <rect width="376" height="308" rx="18" fill="#f0f8f5" stroke="#d8e9e1"/>
      <text x="24" y="38" fill="#267657" font-size="23" font-weight="700">Screen</text>
      <text x="24" y="64" fill="#52687a" font-size="16">Everything on the chosen output.</text>
      <rect x="53" y="86" width="270" height="140" rx="9" fill="#e3f0e9" stroke="#318461" stroke-width="3"/>
      <rect x="67" y="101" width="116" height="87" rx="5" fill="#fff" stroke="#b2d2c0"/>
      <path d="M78 116h55m-55 15h89m-89 13h65m-65 13h79" stroke="#b9d7c8" stroke-width="5" stroke-linecap="round"/>
      <rect x="161" y="120" width="141" height="91" rx="6" fill="#fff" stroke="#b2d2c0"/>
      <path d="M173 136h95m-95 17h73m-73 17h110m-110 17h61" stroke="#b9d7c8" stroke-width="5" stroke-linecap="round"/>
      <text x="24" y="262" fill="#243d53" font-size="17" font-weight="700">Preview the selected monitor.</text>
      <text x="24" y="285" fill="#52687a" font-size="16">Hover a screen to identify it.</text>
    </g>
    <g transform="translate(812 12)">
      <rect width="376" height="308" rx="18" fill="#fff7ed" stroke="#f0e2cc"/>
      <text x="24" y="38" fill="#9c6423" font-size="23" font-weight="700">Region</text>
      <text x="24" y="64" fill="#52687a" font-size="16">Just the rectangle you choose.</text>
      <rect x="53" y="86" width="270" height="140" rx="9" fill="#ebe7e1"/>
      <rect x="67" y="101" width="116" height="87" rx="5" fill="#f8f6f2" stroke="#d4cbbd"/>
      <rect x="161" y="120" width="141" height="91" rx="6" fill="#f8f6f2" stroke="#d4cbbd"/>
      <rect x="120" y="138" width="131" height="62" fill="#fbe6bf" fill-opacity=".8" stroke="#bd8133" stroke-width="3" stroke-dasharray="7 5"/>
      <path d="M112 138h16m-8-8v16m123 54h16m-8-8v16" stroke="#9c6423" stroke-width="2"/>
      <text x="24" y="262" fill="#243d53" font-size="17" font-weight="700">Draw with slurp.</text>
      <text x="24" y="285" fill="#52687a" font-size="16">Or repeat your last valid region.</text>
    </g>
    <text x="14" y="342" fill="#71818d" font-size="12">Selection scopes illustrated · not UI screenshots</text>
  </g>
</svg>
